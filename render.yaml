# Render.com blueprint for the public E14 review web app.
# Free, zero-install for visitors. Connect this repo at https://render.com,
# pick "Blueprint", and Render reads this file. No vision/GPU needed.
services:
  - type: web
    name: colombia-veeduria-e14-2026
    runtime: python
    plan: free
    # public_server.py uses only the Python standard library, so there is
    # nothing to install. Pip is run anyway to satisfy Render's build step.
    buildCommand: "python --version"
    startCommand: "python public_server.py"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Supabase connection for login + consensus + the official-data dashboard.
      # sync:false means Render prompts you for the value on deploy; it is NOT
      # stored in this repo. Use the PUBLISHABLE key (safe in the browser), never
      # the service_role key.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
